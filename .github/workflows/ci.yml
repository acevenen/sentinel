name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin to the Go line golangci-lint v2.1.6 is built against (go1.24).
          # `stable` now resolves to Go 1.26, whose stdlib the pinned linter
          # cannot type-check, causing it to panic before evaluating any file.
          # Test and Build stay on `stable`. Raise both together when bumping
          # golangci-lint to a release built with a newer Go.
          go-version: "1.24"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
      - name: Go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run tests with race detector
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: go build -trimpath -o sentinel .
      - name: Smoke test
        run: ./sentinel version
