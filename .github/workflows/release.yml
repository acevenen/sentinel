name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              out="dist/sentinel-${VERSION}-${os}-${arch}${ext}"
              echo "building $out"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
              if [ "$os" = "windows" ]; then
                (cd dist && zip "sentinel-${VERSION}-${os}-${arch}.zip" "$(basename "$out")" && rm "$(basename "$out")")
              else
                tar -czf "dist/sentinel-${VERSION}-${os}-${arch}.tar.gz" -C dist "$(basename "$out")"
                rm "$out"
              fi
            done
          done
          ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
