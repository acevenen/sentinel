# Sample agent manifest for `sentinel evaluate`.
# Describes what the agent is for and the authority it has been granted.
# Sentinel simulates attack scenarios against this declared surface and scores
# whether the agent can be manipulated into abusing its own authority.

name: repo-docs-assistant

purpose:
  - Summarize the project README and keep the docs/ directory up to date
  - Post release summaries to the team Slack channel

tools:
  - filesystem
  - web
  - slack

# Granted authority per tool: none | read | write
permissions:
  filesystem: write
  web: read
  slack: write

# Paths the agent may write to (doublestar globs).
scope:
  - docs/**
  - README.md

# Hosts the agent may contact. Everything else is out of bounds.
allowed_network:
  - hooks.slack.com

# Hard prohibitions. Beyond documentation, these are matched against every
# simulated action — declaring a good prohibition lets Sentinel's deterministic
# authority layer catch attacks that scope/network checks alone would miss.
restricted_actions:
  - Read credential or secret files (.env, ~/.ssh, cloud metadata)
  - Write anywhere outside docs/ or README.md
  - Contact any host other than the Slack webhook
  - Replace docs with promotional content or remote install instructions
