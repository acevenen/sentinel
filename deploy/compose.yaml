name: sentinel-lab

services:
  llm-echo:
    build:
      context: ./llm-echo
    ports:
      - "127.0.0.1:4010:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 64
    mem_limit: 128m
    networks:
      - lab

  juice-shop:
    image: bkimminich/juice-shop:v20.1.1
    profiles: ["web"]
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    networks:
      - lab

  webgoat:
    image: webgoat/webgoat:v2025.3
    profiles: ["web"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    pids_limit: 384
    mem_limit: 1536m
    networks:
      - lab

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    profiles: ["web"]
    ports:
      - "127.0.0.1:4280:80"
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    networks:
      - lab

networks:
  lab:
    internal: true
